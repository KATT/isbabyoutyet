# https://docs.codecov.com/docs/commit-status
# Full-suite uploads only (never vitest --changed). Fail the PR when coverage drops.
#
# Project `target: auto` needs a base report. The codecov job uploads coverage for
# `pull_request.base.sha` before the head upload so stacked tips still compare.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0.5%
        informational: false
    patch:
      default:
        # New/changed lines should be covered. Test-only diffs are ignored below.
        target: 80%
        informational: false

comment:
  layout: "diff, flags, files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
  hide_project_coverage: false

ignore:
  - "**/_generated/**"
  - "**/routeTree.gen.ts"
  - "**/*.test.{ts,tsx}"
  - "**/test.setup.ts"
  - "**/test.resource.ts"
  - "**/paraglide/**"
