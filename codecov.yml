# https://docs.codecov.com/docs/codecov-yaml
coverage:
  status:
    project:
      default:
        # Informational until we tune targets; Codecov still posts PR diffs.
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "diff, flags, files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
  hide_project_coverage: false

ignore:
  - "**/_generated/**"
  - "**/routeTree.gen.ts"
  - "**/*.test.{ts,tsx}"
  - "**/test.setup.ts"
  - "**/test.resource.ts"
  - "**/paraglide/**"
