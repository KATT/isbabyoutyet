# https://docs.codecov.com/docs/commit-status
# Full-suite uploads only (never vitest --changed). Codecov is the coverage gate.
#
# Project `target: auto` compares to the PR base commit. That report comes from
# the codecov job on push to main (not from remeasuring the base on every PR).
coverage:
  status:
    project:
      default:
        # Fail on any project coverage drop vs base.
        target: auto
        threshold: 0%
        informational: false
    patch:
      default:
        # Every new/changed line must be covered (test files ignored below).
        target: 100%
        informational: false

comment:
  layout: "diff, flags, files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
  hide_project_coverage: false

ignore:
  - "**/_generated/**"
  - "**/routeTree.gen.ts"
  - "**/*.test.{ts,tsx}"
  - "**/test.setup.ts"
  - "**/test.resource.ts"
  - "**/paraglide/**"
