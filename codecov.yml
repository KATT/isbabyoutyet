# https://docs.codecov.com/docs/commit-status
# Full-suite uploads only (never vitest --changed). Codecov is the coverage gate.
#
# Gate is project coverage only: never go down vs the PR base commit
# (`target: auto`, `threshold: 0%`). Patch status is informational.
#
# Base reports usually come from main/push uploads. For stacked PRs whose base
# tip has no report yet, CI remeasures that base (Turbo-cached) and uploads it.
coverage:
  status:
    project:
      default:
        # Fail if overall coverage drops vs base (no wiggle room).
        target: auto
        threshold: 0%
        informational: false
    patch:
      default:
        # Do not fail PRs on partial diff coverage; project ratchet is the gate.
        informational: true

comment:
  layout: "diff, flags, files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
  hide_project_coverage: false

ignore:
  - "**/_generated/**"
  - "**/routeTree.gen.ts"
  - "**/*.test.{ts,tsx}"
  - "**/test.setup.ts"
  - "**/test.resource.ts"
  - "**/paraglide/**"
