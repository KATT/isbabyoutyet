# Codecov uploads run on main/next/canary pushes only (history graphs).
# PR merge gate is the local compareCoverage ratchet in the `codecov` CI job —
# do not enable GitHub checks or PR comments here.
coverage:
  status: false

comment: false

github_checks:
  annotations: false

ignore:
  - "**/_generated/**"
  - "**/routeTree.gen.ts"
  - "**/*.test.{ts,tsx}"
  - "**/test.setup.ts"
  - "**/test.resource.ts"
  - "**/paraglide/**"
