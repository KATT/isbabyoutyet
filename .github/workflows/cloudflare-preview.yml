name: Cloudflare preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: cloudflare-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  PREVIEW_IDENTIFIER: cloudflare-pr-${{ github.event.pull_request.number }}
  PREVIEW_URL: https://isbabyoutyet-pr-${{ github.event.pull_request.number }}.${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}.workers.dev
  WORKER_NAME: isbabyoutyet-pr-${{ github.event.pull_request.number }}

jobs:
  deploy:
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Validate required preview settings
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
          CONVEX_MANAGEMENT_TOKEN: ${{ secrets.CONVEX_MANAGEMENT_TOKEN }}
          CONVEX_PREVIEW_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          CONVEX_PROJECT_ID: ${{ vars.CONVEX_PROJECT_ID }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
        run: |
          missing=()
          for name in BETTER_AUTH_SECRET CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN \
            CLOUDFLARE_WORKERS_SUBDOMAIN CONVEX_MANAGEMENT_TOKEN \
            CONVEX_PREVIEW_DEPLOY_KEY CONVEX_PROJECT_ID VAPID_PRIVATE_KEY VAPID_PUBLIC_KEY; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing GitHub Actions settings: ${missing[*]}"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure preview environment
        env:
          CONFIGURED_VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
          EMAIL_API_TOKEN: ${{ secrets.CLOUDFLARE_EMAIL_API_TOKEN }}
          CONFIGURED_EMAIL_FROM: ${{ vars.EMAIL_FROM }}
        run: |
          echo "WORKERS_CI=1" >> "$GITHUB_ENV"
          echo "WORKERS_CI_BRANCH=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_PREVIEW_SITE_URL=$PREVIEW_URL" >> "$GITHUB_ENV"
          echo "VAPID_SUBJECT=${CONFIGURED_VAPID_SUBJECT:-mailto:admin@isbabyoutyet.com}" >> "$GITHUB_ENV"
          if [[ -n "$EMAIL_API_TOKEN" && -n "$CONFIGURED_EMAIL_FROM" ]]; then
            echo "CLOUDFLARE_EMAIL_API_TOKEN=$EMAIL_API_TOKEN" >> "$GITHUB_ENV"
            echo "EMAIL_FROM=$CONFIGURED_EMAIL_FROM" >> "$GITHUB_ENV"
          fi

      - name: Deploy Convex preview and build Worker
        run: pnpm --filter web deploy-convex
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PRODUCTION_BRANCH: main
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
          CONVEX_PREVIEW_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}

      - name: Deploy transient Worker
        run: pnpm --filter web exec wrangler deploy --name "$WORKER_NAME"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Publish preview links
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: ${{ env.PREVIEW_URL }}
        with:
          script: |
            const marker = "<!-- cloudflare-preview -->";
            const body = `${marker}
            ## Cloudflare preview

            | Status | Preview |
            | --- | --- |
            | Not yet | [${process.env.PREVIEW_URL}/baby/baby-waiting](${process.env.PREVIEW_URL}/baby/baby-waiting) |
            | Labour started | [${process.env.PREVIEW_URL}/baby/baby-in-labor](${process.env.PREVIEW_URL}/baby/baby-in-labor) |
            | Gone to hospital | [${process.env.PREVIEW_URL}/baby/baby-at-hospital](${process.env.PREVIEW_URL}/baby/baby-at-hospital) |
            | Born | [${process.env.PREVIEW_URL}/baby/baby-born](${process.env.PREVIEW_URL}/baby/baby-born) |

            Login: \`test@example.com\` / \`password\`

            This Worker and its Convex backend are deleted when the pull request closes.`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) =>
              comment.user?.type === "Bot" && comment.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  cleanup:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Delete transient Worker
        id: delete_worker
        continue-on-error: true
        run: pnpm --filter web exec wrangler delete "$WORKER_NAME" --force
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Delete Convex preview
        id: delete_convex
        continue-on-error: true
        run: pnpm --filter web delete-convex-preview "$PREVIEW_IDENTIFIER"
        env:
          CONVEX_MANAGEMENT_TOKEN: ${{ secrets.CONVEX_MANAGEMENT_TOKEN }}
          CONVEX_PROJECT_ID: ${{ vars.CONVEX_PROJECT_ID }}

      - name: Verify cleanup completed
        if: always()
        env:
          CONVEX_OUTCOME: ${{ steps.delete_convex.outcome }}
          WORKER_OUTCOME: ${{ steps.delete_worker.outcome }}
        run: |
          if [[ "$WORKER_OUTCOME" != "success" || "$CONVEX_OUTCOME" != "success" ]]; then
            echo "Preview cleanup failed; inspect the deletion steps above."
            exit 1
          fi
