name: main

on:
  pull_request:
    types: [synchronize, opened, reopened]
  # Merge queue tests a temporary merge commit (`gh-readonly-queue/...`).
  # Without this, required checks never start and the queue waits forever.
  merge_group:
  push:
    branches: [main, next, canary]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Changed-test / coverage baseline SHAs:
  # - pull_request: PR base and branch tip
  # - merge_group: parent of the speculative merge (previous queue entry, or
  #   the target-branch tip if this is first) and the merge-group HEAD
  # - push: github.sha as HEAD; CI_BASE_SHA is unused
  CI_BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
  CI_HEAD_SHA: ${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha || github.sha }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          lfs: true
          # Need enough history for `vitest --changed <base.sha>` merge-base.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Vitest modules
        uses: actions/cache@v6
        with:
          path: node_modules/.experimental-vitest-cache
          key: vitest-${{ runner.os }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            vitest-${{ runner.os }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml') }}-

      - name: Cache Turborepo tasks
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml', 'turbo.json') }}-

      # OIDC exchange via TURBO_TEAM + Vercel Turborepo CLI policy (no TURBO_TOKEN secret).
      - name: Set up Turborepo Remote Cache
        if: ${{ vars.TURBO_TEAM != '' }}
        uses: vercel/setup-turborepo-remote-cache-action@v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Format
        run: pnpm format

      - name: Lint
        run: pnpm lint-fix

      - name: Typecheck
        run: pnpm typecheck

      # PRs and merge groups: Vitest --changed only (no coverage).
      # Merge queue compares against merge_group.base_sha — the previous queue
      # commit — so later entries do not re-run the whole queue's tests.
      - name: Show changed-test range
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: |
          set -euo pipefail
          if [ -z "${CI_BASE_SHA}" ]; then
            echo "CI_BASE_SHA is empty" >&2
            exit 1
          fi
          git rev-parse --verify "${CI_BASE_SHA}^{commit}"
          git merge-base --is-ancestor "${CI_BASE_SHA}" HEAD
          PARENT="$(git rev-parse HEAD~1)"
          {
            echo "## Changed-test range"
            echo ""
            if [ "${{ github.event_name }}" = "merge_group" ]; then
              echo "Merge queue: \`vitest --changed\` vs previous queue commit (\`merge_group.base_sha\`)."
              echo "First parent of HEAD: \`${PARENT}\`"
              if [ "${CI_BASE_SHA}" != "${PARENT}" ]; then
                echo "Note: payload SHA differs from \`HEAD~1\`; using \`merge_group.base_sha\`."
              fi
            else
              echo "PR: \`vitest --changed\` vs \`pull_request.base.sha\`."
            fi
            echo ""
            echo "- Base: \`${CI_BASE_SHA}\`"
            echo "- HEAD: \`$(git rev-parse HEAD)\`"
            echo ""
            echo '```'
            git log --oneline "${CI_BASE_SHA}..HEAD"
            echo '```'
            echo ""
            echo "Changed files:"
            echo '```'
            git diff --name-only "${CI_BASE_SHA}"
            echo '```'
          } | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Test (changed vs base)
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: |
          pnpm pretest:coverage
          pnpm exec vitest run --changed "$CI_BASE_SHA"

      - name: Knip
        run: pnpm knip

  # Parallel with `checks`. Full-suite coverage + local ratchet vs PR base SHA
  # (main push or stacked inner-PR tip). Codecov.io upload is history-only.
  # Skip in the merge queue: coverage already ratcheted on the PR, and skipped
  # jobs still report success for required checks.
  codecov:
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    # Probe/HIT path should stay fast; a hang or MISS-heavy path means fix CI.
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0
          # On PRs, start from the branch tip (not the merge commit).
          ref: ${{ env.CI_HEAD_SHA }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Vitest modules
        uses: actions/cache@v6
        with:
          path: node_modules/.experimental-vitest-cache
          key: vitest-${{ runner.os }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            vitest-${{ runner.os }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml') }}-

      - name: Cache Turborepo tasks
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml', 'turbo.json') }}-

      - name: Set up Turborepo Remote Cache
        if: ${{ vars.TURBO_TEAM != '' }}
        uses: vercel/setup-turborepo-remote-cache-action@v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      # Exact SHA only — no restore-keys fallback (would compare against the wrong tip).
      - name: Restore PR base coverage baseline
        id: baseline
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v6
        with:
          path: .coverage-baseline
          key: coverage-summary-${{ env.CI_BASE_SHA }}

      # Stacked tips / races: remeasure base when no Actions cache entry exists yet.
      - name: Measure PR base coverage baseline
        if: github.event_name == 'pull_request' && steps.baseline.outputs.cache-hit != 'true'
        run: |
          git checkout --force "$CI_BASE_SHA"
          pnpm install --frozen-lockfile
          pnpm exec turbo run test:coverage
          test -f coverage/coverage-summary.json
          mkdir -p .coverage-baseline
          cp coverage/coverage-summary.json .coverage-baseline/coverage-summary.json
          git checkout --force "$CI_HEAD_SHA"
          pnpm install --frozen-lockfile

      - name: Full coverage (Turbo-cached)
        run: |
          pnpm exec turbo run test:coverage
          test -f coverage/coverage-summary.json

      - name: Compare coverage with PR base
        if: github.event_name == 'pull_request'
        run: |
          test -f .coverage-baseline/coverage-summary.json
          pnpm coverage:compare

      # Cache this tip so stacked outer PRs can restore it as their base.
      - name: Prepare coverage baseline for cache
        run: |
          mkdir -p .coverage-baseline
          cp coverage/coverage-summary.json .coverage-baseline/coverage-summary.json

      - name: Save coverage baseline
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .coverage-baseline
          key: coverage-summary-${{ env.CI_HEAD_SHA }}

      # History only — codecov.yml disables GitHub statuses/comments/checks.
      - name: Upload coverage to Codecov
        if: hashFiles('coverage/lcov.info') != ''
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          flags: unit
          name: vitest
          override_commit: ${{ env.CI_HEAD_SHA }}
          token: ${{ secrets.CODECOV_TOKEN }}
          use_oidc: ${{ secrets.CODECOV_TOKEN == '' }}
          fail_ci_if_error: false
          verbose: true
