name: main

on:
  pull_request:
    types: [synchronize, opened, reopened]
  push:
    branches: [main, next, canary]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
          # Need enough history for `vitest --changed <base.sha>` merge-base.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Vitest modules
        uses: actions/cache@v4
        with:
          path: node_modules/.experimental-vitest-cache
          key: vitest-${{ runner.os }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            vitest-${{ runner.os }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml') }}-

      - name: Cache Turborepo tasks
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml', 'turbo.json') }}-

      # OIDC exchange via TURBO_TEAM + Vercel Turborepo CLI policy (no TURBO_TOKEN secret).
      - name: Set up Turborepo Remote Cache
        if: ${{ vars.TURBO_TEAM != '' }}
        uses: vercel/setup-turborepo-remote-cache-action@v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Format
        run: pnpm format

      - name: Lint
        run: pnpm lint-fix

      - name: Typecheck
        run: pnpm typecheck

      # PRs: Vitest --changed only (no coverage). Full coverage lives in the codecov job.
      - name: Test (changed vs base)
        if: github.event_name == 'pull_request'
        run: |
          pnpm pretest:coverage
          pnpm exec vitest run --changed "${{ github.event.pull_request.base.sha }}"

      - name: Knip
        run: pnpm knip

  # Parallel with `checks`. Full-suite coverage for Codecov (never --changed).
  codecov:
    runs-on: ubuntu-latest
    # Keep tight: probe+HIT should stay fast; a hang or MISS-heavy path means fix CI.
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
          # On PRs, start from the branch tip (not the merge commit) so coverage
          # and Codecov patch status share the same commit SHA.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Vitest modules
        uses: actions/cache@v4
        with:
          path: node_modules/.experimental-vitest-cache
          key: vitest-${{ runner.os }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            vitest-${{ runner.os }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml') }}-

      - name: Cache Turborepo tasks
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml', 'turbo.json') }}-

      - name: Set up Turborepo Remote Cache
        if: ${{ vars.TURBO_TEAM != '' }}
        uses: vercel/setup-turborepo-remote-cache-action@v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      # Project `target: auto` needs a report at pull_request.base.sha.
      # main/push and stacked inner-PR head uploads usually already provide it.
      # Probe (with short retries for processing races); only remeasure on miss.
      - name: Probe Codecov for PR base report
        id: base_report
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          found=false
          for _attempt in 1 2 3; do
            code="$(curl -sS -o /tmp/codecov-base.json -w "%{http_code}" \
              "https://api.codecov.io/api/v2/github/${GITHUB_REPOSITORY%/*}/repos/${GITHUB_REPOSITORY#*/}/commits/${BASE_SHA}")" || code=000
            if [[ "$code" == "200" ]]; then
              if jq -e '.totals.coverage != null' /tmp/codecov-base.json >/dev/null; then
                found=true
                echo "Base ${BASE_SHA} on Codecov (coverage=$(jq -r '.totals.coverage' /tmp/codecov-base.json))"
                break
              fi
              # Report accepted but still processing — retry briefly.
            elif [[ "$code" == "404" ]]; then
              break
            fi
            sleep 5
          done
          echo "found=${found}" | tee -a "$GITHUB_OUTPUT"

      - name: Coverage for PR base (report missing)
        if: github.event_name == 'pull_request' && steps.base_report.outputs.found == 'false'
        run: |
          git checkout --force "${{ github.event.pull_request.base.sha }}"
          pnpm install --frozen-lockfile
          pnpm exec turbo run test:coverage
          test -f coverage/lcov.info
          cp coverage/lcov.info /tmp/base-lcov.info
          git checkout --force "${{ github.event.pull_request.head.sha }}"
          pnpm install --frozen-lockfile

      - name: Upload PR base coverage to Codecov
        if: github.event_name == 'pull_request' && steps.base_report.outputs.found == 'false'
        uses: codecov/codecov-action@v5
        with:
          files: /tmp/base-lcov.info
          flags: unit
          name: vitest-base
          override_commit: ${{ github.event.pull_request.base.sha }}
          override_branch: ${{ github.base_ref }}
          token: ${{ secrets.CODECOV_TOKEN }}
          use_oidc: ${{ secrets.CODECOV_TOKEN == '' }}
          fail_ci_if_error: true
          verbose: true

      - name: Full coverage (Turbo-cached)
        run: |
          pnpm exec turbo run test:coverage
          test -f coverage/lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          flags: unit
          name: vitest
          # Align upload commit with the tree we measured (PR head tip, else push SHA).
          override_commit: ${{ github.event.pull_request.head.sha || github.sha }}
          # Prefer upload token when present; otherwise OIDC via Codecov GitHub App.
          token: ${{ secrets.CODECOV_TOKEN }}
          use_oidc: ${{ secrets.CODECOV_TOKEN == '' }}
          fail_ci_if_error: true
          verbose: true
