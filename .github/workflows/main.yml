name: main

on:
  pull_request:
    types: [synchronize, opened, reopened]
  push:
    branches: [main, next, canary]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Vitest modules
        uses: actions/cache@v4
        with:
          path: node_modules/.experimental-vitest-cache
          key: vitest-${{ runner.os }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            vitest-${{ runner.os }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml') }}-

      - name: Cache vitest-affected graphs
        uses: actions/cache@v4
        with:
          path: |
            .vitest-affected
            apps/web/.vitest-affected
            packages/*/.vitest-affected
            oxlint-plugins/.vitest-affected
          key: vitest-affected-${{ runner.os }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            vitest-affected-${{ runner.os }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml') }}-
            vitest-affected-${{ runner.os }}-

      - name: Cache Turborepo tasks
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml', 'turbo.json') }}-

      # OIDC exchange via TURBO_TEAM + Vercel Turborepo CLI policy (no TURBO_TOKEN secret).
      - name: Set up Turborepo Remote Cache
        if: ${{ vars.TURBO_TEAM != '' }}
        uses: vercel/setup-turborepo-remote-cache-action@v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Typecheck scripts
        run: pnpm typecheck:scripts

      - name: Format
        run: pnpm format

      - name: Lint
        run: pnpm lint-fix

      - name: Typecheck
        run: pnpm typecheck

      # PRs: package-level vitest-affected (root multi-project mode skips selection).
      - name: Test affected packages
        if: github.event_name == 'pull_request'
        env:
          VITEST_AFFECTED_REF: ${{ github.event.pull_request.base.sha }}
        run: pnpm test:affected

      # main/push: full suite + Turbo coverage cache for the baseline.
      - name: Test coverage (full)
        if: github.event_name != 'pull_request'
        env:
          VITEST_AFFECTED_DISABLED: "1"
        run: pnpm exec turbo run test:coverage --summarize

      - name: Report Turbo coverage cache
        if: github.event_name != 'pull_request' && always()
        run: |
          summary="$(ls -t .turbo/runs/*.json | head -1)"
          jq -r '.tasks[] | select(.taskId=="//#test:coverage") | "::notice title=Turbo coverage cache::cache=\(.cache.status) source=\(.cache.source // "n/a") timeSaved=\(.cache.timeSaved // 0)ms"' "$summary"
          test -f coverage/coverage-summary.json

      - name: Report vitest-affected decisions
        if: github.event_name == 'pull_request' && always()
        run: |
          shopt -s nullglob
          files=(.vitest-affected/stats.jsonl apps/web/.vitest-affected/stats.jsonl packages/*/.vitest-affected/stats.jsonl oxlint-plugins/.vitest-affected/stats.jsonl)
          if (( ${#files[@]} == 0 )); then
            echo "::notice::No vitest-affected stats yet (graphs build on first full package run)."
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "::notice title=vitest-affected $(dirname "$f")::$(tail -n 1 "$f")"
          done

      - name: Knip
        run: pnpm knip

      - name: Skip coverage compare on selective PR runs
        if: github.event_name == 'pull_request'
        run: |
          echo "::notice::Skipping coverage compare: PR runs use vitest-affected selection. Full-suite baseline is updated on main pushes only."

      - name: Prepare main coverage baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p .coverage-baseline
          cp coverage/coverage-summary.json .coverage-baseline/coverage-summary.json

      - name: Save main coverage baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: .coverage-baseline
          key: coverage-main-${{ github.sha }}
