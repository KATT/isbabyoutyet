# Seed Convex preview homepage photos after Vercel is Ready.
#
# Preview photo uploads (sharp + storage) used to run inside `deploy-convex.ts`
# and dominated Vercel build time. Demo login + fixture text still seed during
# the Vercel build when the preview backend is recreated; photos follow here.
#
# Requires GitHub Actions secret CONVEX_DEPLOY_KEY = Convex Preview Deploy Key
# (same key Vercel uses for preview CONVEX_DEPLOY_KEY).

name: seed-preview

on:
  deployment_status:

concurrency:
  group: seed-preview-${{ github.event.deployment.ref }}
  cancel-in-progress: true

jobs:
  seed-homepage-photos:
    if: github.event.deployment_status.state == 'success' && !contains(github.event.deployment.environment, 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v7
        with:
          lfs: true
          ref: ${{ github.event.deployment.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Seed homepage demo photos
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "CONVEX_DEPLOY_KEY is not set in GitHub secrets; cannot seed Convex preview photos."
            exit 1
          fi
          REF="${{ github.event.deployment.ref }}"
          BRANCH="${REF#refs/heads/}"
          pnpm --filter @workspace/convex run seed:homepage:photos -- --preview-name "$BRANCH"
