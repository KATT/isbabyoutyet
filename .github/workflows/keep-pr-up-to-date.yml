name: keep-pr-up-to-date

# Keep auto-merge PRs up to date: passing required checks, no conflicts, then
# update (or rebase a whole stack). One eligible update per run.
#
# GitHub does not retrigger workflows for GITHUB_TOKEN pushes. Configure a
# GitHub App (preferred) or PAT so required checks re-run after an update:
#   AUTO_UPDATE_APP_ID + AUTO_UPDATE_APP_PRIVATE_KEY
#   or AUTO_UPDATE_TOKEN
# App permissions: contents read/write, pull requests read/write.
#
# Triggers are event-driven (no cron):
# - push to a base branch: other auto-merge PRs just became behind
# - PR auto-merge enabled
# - `main` CI completed: Actions checks just settled
# - Vercel commit status completed (required, not an Actions workflow)
# Stack rebase force-pushes every member of an eligible stack, including PRs
# that do not themselves have auto-merge.

on:
  push:
    branches: [main, next, canary]
  pull_request:
    types:
      - auto_merge_enabled
  workflow_run:
    workflows: [main]
    types: [completed]
  status:
  workflow_dispatch:

concurrency:
  group: keep-pr-up-to-date
  cancel-in-progress: false

jobs:
  keep-up-to-date:
    if: ${{ github.event_name != 'status' || github.event.context == 'Vercel' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Mint GitHub App token
        id: app-token
        if: ${{ secrets.AUTO_UPDATE_APP_ID != '' && secrets.AUTO_UPDATE_APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AUTO_UPDATE_APP_ID }}
          private-key: ${{ secrets.AUTO_UPDATE_APP_PRIVATE_KEY }}

      - name: Require a token that retriggers checks
        if: ${{ steps.app-token.outputs.token == '' && secrets.AUTO_UPDATE_TOKEN == '' }}
        run: |
          echo "::error::GITHUB_TOKEN updates do not retrigger required checks, so auto-merge stalls. Set AUTO_UPDATE_APP_ID and AUTO_UPDATE_APP_PRIVATE_KEY (or AUTO_UPDATE_TOKEN)."
          exit 1

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ steps.app-token.outputs.token || secrets.AUTO_UPDATE_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build keep-up-to-date CLI
        run: pnpm --filter @workspace/scripts build

      - name: Keep auto-merge PRs up to date
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.AUTO_UPDATE_TOKEN }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.AUTO_UPDATE_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node packages/scripts/dist/keepPrUpToDateCli.js
